name: e2e

# Playwright e2e — 사이드패널 smoke + paste 모달 closed Shadow DOM 격리.
# vite dev 환경(headless chromium) 위에서 실행. dev 서버 페이지만 띄우므로 확장 로드/디스플레이 불필요.
# 확장 로드(background SW + offscreen + NER) 경로는 production 빌드가 필요해 extension-e2e.yml(야간 cron)이 담당.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Start vite dev (background)
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          # vite ready 대기 — 90초 한도. 첫 회 CI는 predev에서 tesseract traineddata 5.5MB 다운로드 +
          # vite 자체 부팅으로 30~60초 걸릴 수 있음. 캐싱 적용 후엔 5~10s 안에 끝남.
          # CRXJS는 루트 / 에 index.html을 서빙하지 않음(404) — @vite/client로 liveness 확인.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5173/@vite/client > /dev/null; then
              echo "vite ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "vite failed to start within 90s"
          tail -50 /tmp/vite.log
          exit 1

      - name: Run e2e (smoke)
        # paste-modal/screenshots smoke만 dev 서버 위에서 실행. 확장을 로드하지 않으므로 xvfb 불필요.
        # extension.spec.ts(확장 로드 + offscreen/NER)는 production 빌드가 필요해 extension-e2e.yml이 담당.
        run: npx playwright test playwright/paste-modal.spec.ts playwright/screenshots.spec.ts --reporter=list

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
